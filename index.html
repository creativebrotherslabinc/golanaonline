          document.head.querySelectorAll('link[rel*="icon"]').forEach(function(l) {

          });
          if (!hasPng) {
            var lnk = document.createElement('link');
            lnk.rel = 'icon'; lnk.type = 'image/png'; lnk.href = '/favicon.png';
            document.head.appendChild(lnk);
          }
        }
        enforcePng();
        var headObs = new MutationObserver(enforcePng);
        var startHeadObs = function() { headObs.observe(document.head, { childList: true }); };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startHeadObs);
        } else {
          startHeadObs();
        }

        // ── Fuzzy scorer ───────────────────────────────────────────
        function score(tool, query) {
          var words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
          if (!words.length) return 0;
          var haystack = (tool.name + ' ' + tool.tags).toLowerCase();
          var nameLow  = tool.name.toLowerCase();
          var pts = 0;
          words.forEach(function(w) {
            if (nameLow === w)                   pts += 60;
            else if (nameLow.startsWith(w))      pts += 40;
            else if (nameLow.includes(w))        pts += 25;
            // whole-word hit in tags
            var wbRe = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b');
            if (wbRe.test(haystack))             pts += 20;
            else if (haystack.includes(w))       pts += 8;
          });
          return pts;
        }

        function search(query) {
          return TOOLS
            .map(function(t) { return { tool: t, pts: score(t, query) }; })
            .filter(function(x) { return x.pts > 0; })
            .sort(function(a, b) { return b.pts - a.pts; })
            .slice(0, 5)
            .map(function(x) { return x.tool; });

          var CAT_LABELS = {
            '/pdf/':'📄 PDF', '/media/':'🖼️ Media', '/calc/':'💰 Calculators',
            '/tools/':'🛠️ Utilities', '/ai/':'🤖 AI Tools', '/dev/':'</> Developer',
            '/time/':'🕐 Time', '/games/':'🎮 Games', '/food-finder/':'📱 Apps',
          };
          function catLabel(route) {
            for (var k in CAT_LABELS) { if (route.startsWith(k)) return CAT_LABELS[k]; }
            return '🔧 Tool';
          }
          function catIcon(route) {
            var icons = { '/pdf/':'📄','/media/':'🖼️','/calc/':'💰','/tools/':'🛠️',
                          '/ai/':'🤖','/dev/':'💻','/time/':'🕐','/games/':'🎮','/food-finder/':'🍽️' };
            for (var k in icons) { if (route.startsWith(k)) return icons[k]; }
            return '🔧';
          }

          var resultsEl = null;

          function hideResults() {
            if (resultsEl) { resultsEl.remove(); resultsEl = null; }
          }

          function showResults(results) {
            hideResults();
            resultsEl = document.createElement('div');
            resultsEl.id = 'golana-results';
            if (!results.length) {
              var none = document.createElement('div');
              none.id = 'golana-no-result';
              none.textContent = 'No tools found — try different keywords.';
              resultsEl.appendChild(none);
            } else {
              results.forEach(function(tool) {
                var item = document.createElement('div');
                item.className = 'gs-item';
                item.innerHTML =
                  '<div class="gs-item-icon">' + catIcon(tool.route) + '</div>' +
                  '<div><div class="gs-item-name">' + tool.name + '</div>' +
                       '<div class="gs-item-cat">' + catLabel(tool.route) + '</div></div>';
                item.addEventListener('mousedown', function(e) {
                  e.preventDefault(); // prevent input blur before click fires
                  navigate(tool.route);
                  input.value = tool.name;
                  hideResults();
                });
                resultsEl.appendChild(item);
              });
            }
            wrap.appendChild(resultsEl);
          }

          // ── Events ───────────────────────────────────────────────
          function runSearch() {
            var q = input.value.trim();
            if (!q) { hideResults(); return; }
            var results = search(q);
            if (results.length === 1) {
              // Single match — go straight there
              navigate(results[0].route);
              input.value = results[0].name;
              hideResults();
            } else {
              showResults(results);
            }
          }

          btn.addEventListener('click', runSearch);

          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { runSearch(); return; }
            if (e.key === 'Escape') { hideResults(); return; }
          });

          // Live suggestions while typing (after 2+ characters)
          input.addEventListener('input', function() {
            var q = input.value.trim();
            if (q.length < 2) { hideResults(); return; }
            showResults(search(q));
          });

          // Close on outside click
          document.addEventListener('click', function(e) {
            if (!wrap.contains(e.target)) hideResults();
          });

          return true;
        };

        var obs = new MutationObserver(function() { if (injectSearch()) obs.disconnect(); });
        document.addEventListener('DOMContentLoaded', function() {
          obs.observe(document.body, { childList: true, subtree: true });
          setTimeout(function() { injectSearch(); obs.disconnect(); }, 3000);
        });
      })();

      // ══════════════════════════════════════════════════════════════
      // 6 · RUN ALL INJECTIONS (called after every SPA navigation)
      // Retries up to 15× at 150 ms intervals until all injections land.
      // ══════════════════════════════════════════════════════════════
      function runAllInjections(attempt) {
        attempt = attempt || 0;
        var done = true;
        done = injectHamburger() && done;
        if (injectSearch) done = (injectSearch() !== false) && done;
        if (injectApps)   done = (injectApps()   !== false) && done;
        if (!done && attempt < 15) {
          setTimeout(function() { runAllInjections(attempt + 1); }, 150);
        }
      }

      // ── Collapse empty / failed ad slots ─────────────────────────
      // CSS already handles data-ad-status="unfilled/error" cases.
      // This JS handles the case where adsbygoogle.js never runs at all
      // (blocked / 400 error) so data-ad-status is never set.
      function collapseEmptyAds() {
        document.querySelectorAll('ins.adsbygoogle').forEach(function(ins) {
          if (ins.getAttribute('data-ad-status') !== 'filled') {
            ins.style.cssText += ';display:none!important;height:0!important;min-height:0!important;';
            var p1 = ins.parentElement;
            if (p1) {
              p1.style.cssText += ';min-height:0!important;height:0!important;';
              var p2 = p1.parentElement;
              if (p2 && !p2.id && p2 !== document.body) {
                p2.style.cssText += ';margin-bottom:0!important;padding-bottom:0!important;';
              }
            }
          }
        });
      }
      // Run once after a delay — no MutationObserver to avoid feedback loops
      setTimeout(collapseEmptyAds, 1500);
    })();
  </script>
  </body>
</html>
