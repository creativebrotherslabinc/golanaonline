<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

     crossorigin="anonymous"></script>
    <script type="module" crossorigin src="/assets/index-MJ358mDA-v2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CupsWWkV.css">
    <style>
      /*
       * Fix: the app root uses "min-h-screen flex flex-col" with main "flex-1"
       * (flex-basis:0). This causes the document to stay exactly 100 vh tall —
       * content inside <main> overflows without making the page scrollable.
       * Solution: let main's intrinsic height drive the document height.
       */
      main {
        flex-basis: auto !important;
        flex-shrink: 0 !important;
      }

      /* Collapse ad slots that Google never filled (adsbygoogle.js blocked) */
      ins.adsbygoogle[data-ad-status="unfilled"],
      ins.adsbygoogle[data-ad-status="error"] {
        display: none !important;
        height: 0 !important;
        min-height: 0 !important;
      }
      div:has(> ins.adsbygoogle[data-ad-status="unfilled"]),
      div:has(> ins.adsbygoogle[data-ad-status="error"]) {
        min-height: 0 !important;
        height: 0 !important;
      }
      div:has(> div > ins.adsbygoogle[data-ad-status="unfilled"]),
      div:has(> div > ins.adsbygoogle[data-ad-status="error"]) {
        margin-bottom: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script>
    (function() {
      // ── Logo replacement ──────────────────────────────────────────
      function replaceLogo() {
        var svg = document.querySelector('header a svg.w-5, header a svg[class*="w-5"]');
        if (svg) {
          var parent = svg.parentElement;
          var img = document.createElement('img');
          img.src = '/favicon.png';
          img.style.width = '20px';
          img.style.height = '20px';
          img.style.objectFit = 'cover';
          img.style.borderRadius = '2px';
          parent.replaceChild(img, svg);
          return true;
        }
        return false;
      }
      if (!replaceLogo()) {
        var logoObserver = new MutationObserver(function() {
          if (replaceLogo()) logoObserver.disconnect();
        });
        document.addEventListener('DOMContentLoaded', function() {
          logoObserver.observe(document.body, { childList: true, subtree: true });
        });
      }

      // ── /games redirect → /#games ────────────────────────────────
      if (window.location.pathname === '/games') {
        window.history.replaceState(null, '', '/');
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var el = document.getElementById('games');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 300);
        });
      }

      // ── Scroll to top on every SPA navigation ────────────────────
      (function() {
        var orig = history.pushState;
        history.pushState = function() {
          orig.apply(this, arguments);
          window.scrollTo(0, 0);
        };
        window.addEventListener('popstate', function() {
          window.scrollTo(0, 0);
        });
      })();

      // ── Replace header nav with hamburger dropdown ────────────────
      (function() {
        var CATEGORIES = [
          { label: '📄 PDF Tools',          href: '/pdf/merger'         },
          { label: '🖼️ Media',              href: '/media/img-compressor'},
          { label: '💰 Calculators',         href: '/calc/mortgage'      },
          { label: '🛠️ Everyday Utilities',  href: '/tools/qr'           },
          { label: '🤖 AI Mini Tools',       href: '/ai/summarizer'      },
          { label: '</> Developer Tools',    href: '/dev/diff'           },
          { label: '🕐 Time & Planning',     href: '/time/worldclock'    },
          { label: '🎮 Games',               href: '/games/ttt'          },
          { label: '📱 Apps',                href: '/#apps', isAnchor: true },
        ];

        var STYLES = [
          '.golana-hamburger{display:flex;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;padding:6px;background:none;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s;flex-shrink:0}',
          '.golana-hamburger:hover{background:#f1f5f9;border-color:#cbd5e1}',
          '.golana-hamburger span{display:block;height:2px;background:#475569;border-radius:2px}',
          '.golana-dropdown{display:none;position:absolute;top:calc(100% + 10px);right:0;min-width:220px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);overflow:hidden;z-index:9999;animation:gdIn .15s ease}',
          '.golana-dropdown.open{display:block}',
          '@keyframes gdIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}',
          '.golana-dropdown a{display:block;padding:11px 18px;font-size:.875rem;font-weight:500;color:#334155;text-decoration:none;transition:background .1s,color .1s;border-bottom:1px solid #f1f5f9}',
          '.golana-dropdown a:last-child{border-bottom:none}',
          '.golana-dropdown a:hover{background:#f8fafc;color:#2563eb}',
          '.golana-wrap{position:relative;margin-left:auto}',
        ].join('');

        function injectHamburger() {
          if (document.getElementById('__nav-injected')) return true;
          var header = document.querySelector('header');
          if (!header) return false;
          var reactNav = header.querySelector('nav');
          if (!reactNav) return false;

          // Inject stylesheet
          var style = document.createElement('style');
          style.textContent = STYLES;
          document.head.appendChild(style);

          // Find the inner flex container (has h-16 and flex items-center)
          var innerContainer = header.querySelector('div[class*="h-16"]') || header;

          // Hide React nav
          reactNav.style.display = 'none';

          // Build wrapper → button + dropdown
          var wrap = document.createElement('div');
          wrap.className = 'golana-wrap';

          var btn = document.createElement('button');
          btn.className = 'golana-hamburger';
          btn.setAttribute('aria-label', 'Open menu');
          btn.setAttribute('aria-expanded', 'false');
          btn.innerHTML = '<span></span><span></span><span></span>';

          var dd = document.createElement('div');
          dd.className = 'golana-dropdown';
          dd.setAttribute('aria-hidden', 'true');

          CATEGORIES.forEach(function(item) {
            var a = document.createElement('a');
            a.textContent = item.label;
            if (item.isAnchor) {
              a.href = '#';
              a.addEventListener('click', function(e) {
                e.preventDefault();
                dd.classList.remove('open');
                var sec = document.getElementById('apps');
                if (sec) sec.scrollIntoView({ behavior: 'smooth' });
              });
            } else {
              a.href = item.href;
            }
            dd.appendChild(a);
          });

          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var open = dd.classList.toggle('open');
            btn.setAttribute('aria-expanded', open);
            dd.setAttribute('aria-hidden', !open);
          });

          document.addEventListener('click', function() {
            dd.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          });

          wrap.appendChild(btn);
          wrap.appendChild(dd);
          innerContainer.appendChild(wrap);

          var m = document.createElement('meta');
          m.id = '__nav-injected';
          document.head.appendChild(m);
          return true;
        }

        var obs = new MutationObserver(function() { if (injectHamburger()) obs.disconnect(); });
        document.addEventListener('DOMContentLoaded', function() {
          obs.observe(document.body, { childList: true, subtree: true });
          setTimeout(function() { injectHamburger(); obs.disconnect(); }, 3000);
        });
      })();

      // ── Apps category + FindingMyFood injection ──────────────────
      (function() {
        function inject() {
          if (document.getElementById('__apps-injected')) return true;

          // Use #time section as template — it has standard tool cards (no custom game UI)
          var templateSection = document.getElementById('time');
          if (!templateSection) return false;

          // Need at least one real tool card anchor to clone from
          var templateCard = templateSection.querySelector('a[href]');
          if (!templateCard) return false;

          // Also need the Games button to anchor next to
          var gamesBtn = document.querySelector('a[href="#games"]');
          if (!gamesBtn) return false;

          var gamesSection = document.getElementById('games');
          if (!gamesSection) return false;

          // ── 1. Apps nav button — clone Games button, change label ──
          var appsBtn = gamesBtn.cloneNode(true);
          appsBtn.setAttribute('href', '#apps');
          // Walk text nodes and replace "Games" with "Apps", swap emoji
          (function replaceText(node) {
            if (node.nodeType === 3) {
              node.textContent = node.textContent.replace('Games', 'Apps').replace('🎮', '📱');
            } else {
              node.childNodes.forEach(replaceText);
            }
          })(appsBtn);
          appsBtn.addEventListener('click', function(e) {
            e.preventDefault();
            var sec = document.getElementById('apps');
            if (sec) sec.scrollIntoView({ behavior: 'smooth' });
          });
          gamesBtn.parentNode.insertBefore(appsBtn, gamesBtn.nextSibling);

          // ── 2. Clone the #time section shell for Apps ─────────────
          var appsSection = templateSection.cloneNode(true);
          appsSection.id = 'apps';

          // Update section title
          var heading = appsSection.querySelector('h2, h3');
          if (heading) heading.textContent = '📱 Apps';

          // Update description
          var desc = appsSection.querySelector('p');
          if (desc) desc.textContent = 'Full interactive apps that run right in your browser.';

          // ── 3. Build FindingMyFood card by cloning a real tool card ──
          var foodCard = templateCard.cloneNode(true);
          // Navigate outside React Router (hard navigation)
          foodCard.setAttribute('href', '/food-finder/');
          foodCard.removeAttribute('data-discover');

          // Replace the SVG icon with the 🍽️ emoji, keeping the same wrapper
          var svgEl = foodCard.querySelector('svg');
          if (svgEl) {
            var emojiNode = document.createElement('span');
            emojiNode.setAttribute('aria-hidden', 'true');
            emojiNode.className = svgEl.className;
            emojiNode.style.fontSize = 'inherit';
            emojiNode.textContent = '🍽️';
            svgEl.parentNode.replaceChild(emojiNode, svgEl);
          }

          // Replace every text node with "FindingMyFood"
          var first = true;
          (function replaceCardText(node) {
            if (node.nodeType === 3 && node.textContent.trim()) {
              node.textContent = first ? 'FindingMyFood' : '';
              first = false;
            } else {
              node.childNodes.forEach(replaceCardText);
            }
          })(foodCard);

          // ── 4. Clear the cloned grid and add only our card ────────
          var grid = appsSection.querySelector('[class*="grid"]');
          if (grid) {
            grid.innerHTML = '';
            grid.appendChild(foodCard);
          }

          // Insert Apps section after Games
          gamesSection.parentNode.insertBefore(appsSection, gamesSection.nextSibling);

          // Mark done
          var m = document.createElement('meta');
          m.id = '__apps-injected';
          document.head.appendChild(m);
          return true;
        }

        var obs = new MutationObserver(function() { if (inject()) obs.disconnect(); });
        document.addEventListener('DOMContentLoaded', function() {
          obs.observe(document.body, { childList: true, subtree: true });
          setTimeout(function() { inject(); obs.disconnect(); }, 3000);
        });
      })();

      // ── Collapse empty / failed ad slots ─────────────────────────
      // CSS already handles data-ad-status="unfilled/error" cases.
      // This JS handles the case where adsbygoogle.js never runs at all
      // (blocked / 400 error) so data-ad-status is never set.
      function collapseEmptyAds() {
        document.querySelectorAll('ins.adsbygoogle').forEach(function(ins) {
          if (ins.getAttribute('data-ad-status') !== 'filled') {
            ins.style.cssText += ';display:none!important;height:0!important;min-height:0!important;';
            var p1 = ins.parentElement;
            if (p1) {
              p1.style.cssText += ';min-height:0!important;height:0!important;';
              var p2 = p1.parentElement;
              if (p2 && !p2.id && p2 !== document.body) {
                p2.style.cssText += ';margin-bottom:0!important;padding-bottom:0!important;';
              }
            }
          }
        });
      }
      // Run once after a delay — no MutationObserver to avoid feedback loops
      setTimeout(collapseEmptyAds, 1500);
    })();
  </script>
  </body>
</html>
